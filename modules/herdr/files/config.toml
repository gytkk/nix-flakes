onboarding = false
[keys]
prefix = "ctrl+a"
new_workspace = ""
previous_workspace = "prefix+shift+up"
next_workspace = "prefix+shift+down"
switch_workspace = "prefix+shift+1..9"

[[keys.command]]
key = "prefix+shift+n"
type = "popup"
description = "Select a directory and create a workspace"
width = "80%"
height = "60%"
command = '''
selected_dir="$(zoxide query -l | fzf --prompt='Workspace cwd> ')" || exit 0
[ -n "$selected_dir" ] || exit 0
"$HERDR_BIN_PATH" workspace create --cwd "$selected_dir" --focus >/dev/null
'''

[theme]
name = "vesper"

auto_switch = false
[theme.custom]
overlay0 = "#ffffff"
surface0 = "#2c313a"

[ui]
prompt_new_tab_name = false
