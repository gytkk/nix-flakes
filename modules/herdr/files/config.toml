onboarding = false
[keys]
prefix = "ctrl+space"

# workspace 생성 popup을 위해 비워둠
new_workspace = ""

# workspace 간의 이동(즉시)
previous_workspace = "ctrl+shift+tab"
next_workspace = "ctrl+tab"
switch_workspace = ["cmd+1..9", "alt+1..9"]

# workspace 간의 이동(picker)
workspace_picker = ["prefix+shift+s"]
navigate_workspace_up = "up"
navigate_workspace_down = "down"

# agent 간의 이동(즉시)
previous_agent = "prefix+shift+comma"
next_agent = "prefix+shift+period"
focus_agent = "prefix+shift+1..9"

# agent 간의 이동(picker)
goto = ["prefix+shift+a"]

[[keys.command]]
key = "prefix+shift+n"
type = "popup"
description = "Select a directory and create a workspace"
width = "80%"
height = "60%"
command = '''
selected_dir="$(zoxide query -l | fzf --prompt='Workspace cwd> ')" || exit 0
[ -n "$selected_dir" ] || exit 0
"$HERDR_BIN_PATH" workspace create --cwd "$selected_dir" --focus >/dev/null
'''

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "Annotate selected text"

[[keys.command]]
key = "prefix+shift+y"
type = "plugin_action"
command = "annotate.copy-context"
description = "Copy annotations as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "Copy and archive annotations"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "Manage annotations"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "Review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "Review the agent's last reply"

[theme]
name = "one-light"
auto_switch = false

[ui]
host_cursor = "native"
prompt_new_tab_name = false
