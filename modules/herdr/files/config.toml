onboarding = false
[keys]
prefix = "ctrl+space"

# tab 생성, 닫기와 이동. 기존 prefix 단축키도 유지한다.
new_tab = ["cmd+t", "prefix+c"]
close_tab = ["cmd+w", "prefix+shift+x"]
previous_tab = ["ctrl+shift+tab", "prefix+p"]
next_tab = ["ctrl+tab", "prefix+n"]

# workspace 생성 popup을 위해 비워둠
new_workspace = ""

# workspace 간의 이동(즉시)
previous_workspace = "cmd+["
next_workspace = "cmd+]"
switch_workspace = ["cmd+1..9", "alt+1..9"]

# workspace 간의 이동(picker)
workspace_picker = ["prefix+shift+s"]
navigate_workspace_up = "up"
navigate_workspace_down = "down"

# agent 간의 이동(즉시)
previous_agent = ["cmd+shift+[", "prefix+shift+comma"]
next_agent = ["cmd+shift+]", "prefix+shift+period"]
focus_agent = "prefix+shift+1..9"

# agent 간의 이동(picker)
goto = ["prefix+shift+a"]

[[keys.command]]
key = "prefix+shift+n"
type = "popup"
description = "Select a directory and create a workspace"
width = "80%"
height = "60%"
command = '''
selected_dir="$(zoxide query -l | fzf --prompt='Workspace cwd> ')" || exit 0
[ -n "$selected_dir" ] || exit 0
"$HERDR_BIN_PATH" workspace create --cwd "$selected_dir" --focus >/dev/null
'''

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "Annotate selected text"

[[keys.command]]
key = "prefix+shift+y"
type = "plugin_action"
command = "annotate.copy-context"
description = "Copy annotations as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "Copy and archive annotations"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "Manage annotations"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "Review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "Review the agent's last reply"

[theme]
name = "one-light"
auto_switch = false

[ui]
host_cursor = "native"
prompt_new_tab_name = false

[ui.sidebar.agents.rows_by_agent]
codex = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent", "$summary", { token = "$subagent_count", dim = true }],
  [{ token = "$subagent_1_status", fg = "#696c77", rules = [{ starts_with = "●", fg = "#50a14f", bold = true }, { starts_with = "✓", fg = "#0184bc" }, { starts_with = "■", fg = "#c18401" }, { starts_with = "×", fg = "#e45649", bold = true }] }, "$subagent_1"],
  [{ token = "$subagent_1_activity", dim = true }],
  [{ token = "$subagent_2_status", fg = "#696c77", rules = [{ starts_with = "●", fg = "#50a14f", bold = true }, { starts_with = "✓", fg = "#0184bc" }, { starts_with = "■", fg = "#c18401" }, { starts_with = "×", fg = "#e45649", bold = true }] }, "$subagent_2"],
  [{ token = "$subagent_2_activity", dim = true }],
  [{ token = "$subagent_3_status", fg = "#696c77", rules = [{ starts_with = "●", fg = "#50a14f", bold = true }, { starts_with = "✓", fg = "#0184bc" }, { starts_with = "■", fg = "#c18401" }, { starts_with = "×", fg = "#e45649", bold = true }] }, "$subagent_3"],
  [{ token = "$subagent_3_activity", dim = true }],
  [{ token = "$subagent_4_status", fg = "#696c77", rules = [{ starts_with = "●", fg = "#50a14f", bold = true }, { starts_with = "✓", fg = "#0184bc" }, { starts_with = "■", fg = "#c18401" }, { starts_with = "×", fg = "#e45649", bold = true }] }, "$subagent_4"],
  [{ token = "$subagent_4_activity", dim = true }],
  [{ token = "$subagent_5_status", fg = "#696c77", rules = [{ starts_with = "●", fg = "#50a14f", bold = true }, { starts_with = "✓", fg = "#0184bc" }, { starts_with = "■", fg = "#c18401" }, { starts_with = "×", fg = "#e45649", bold = true }] }, "$subagent_5"],
  [{ token = "$subagent_5_activity", dim = true }],
  [{ token = "$subagent_6_status", fg = "#696c77", rules = [{ starts_with = "●", fg = "#50a14f", bold = true }, { starts_with = "✓", fg = "#0184bc" }, { starts_with = "■", fg = "#c18401" }, { starts_with = "×", fg = "#e45649", bold = true }] }, "$subagent_6"],
  [{ token = "$subagent_6_activity", dim = true }],
  [{ token = "$subagent_7_status", fg = "#696c77", rules = [{ starts_with = "●", fg = "#50a14f", bold = true }, { starts_with = "✓", fg = "#0184bc" }, { starts_with = "■", fg = "#c18401" }, { starts_with = "×", fg = "#e45649", bold = true }] }, "$subagent_7"],
  [{ token = "$subagent_7_activity", dim = true }],
]
pi = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent", "$summary"],
  ["$subagent_1"],
  ["$subagent_1_activity"],
  ["$subagent_2"],
  ["$subagent_2_activity"],
  ["$subagent_3"],
  ["$subagent_3_activity"],
  ["$subagent_4"],
  ["$subagent_4_activity"],
  ["$subagent_5"],
  ["$subagent_5_activity"],
  ["$subagent_6"],
  ["$subagent_6_activity"],
  ["$subagent_7"],
  ["$subagent_7_activity"],
]
