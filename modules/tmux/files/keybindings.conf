# Prefix.
set-option -g prefix C-a
set-option -g prefix2 None
unbind-key C-b
bind-key -N "Send prefix to nested tmux sessions" C-a send-prefix

# Pane resizing. Use control letters because macOS may intercept control-arrow.
bind-key -r -N "Resize pane left" C-h resize-pane -L 5
bind-key -r -N "Resize pane down" C-j resize-pane -D 5
bind-key -r -N "Resize pane up" C-k resize-pane -U 5
bind-key -r -N "Resize pane right" C-l resize-pane -R 5

# Pane and window management.
bind-key -N "Kill current pane" x kill-pane
bind-key -N "Kill current window" X kill-window
