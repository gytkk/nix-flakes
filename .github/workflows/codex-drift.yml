name: Codex Binary Drift

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "packages/apps/codex/**"
      - ".github/workflows/codex-drift.yml"
  push:
    branches: [main]
    paths:
      - "packages/apps/codex/**"
      - ".github/workflows/codex-drift.yml"

permissions:
  contents: read

jobs:
  drift:
    name: Check codex-package drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check drift
        shell: bash
        run: |
          packages/apps/codex/check-drift.sh 2>&1 | tee drift.log
          rc=${PIPESTATUS[0]}
          {
            echo '```'
            cat drift.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
