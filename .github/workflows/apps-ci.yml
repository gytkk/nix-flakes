name: App Packages CI

on:
  pull_request:
    paths:
      - "packages/apps/**"
      - "lib/pkgs.nix"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/apps-ci.yml"
      - ".github/workflows/apps-update.yml"
  push:
    branches: [main]
    paths:
      - "packages/apps/**"
      - "lib/pkgs.nix"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/apps-ci.yml"
      - ".github/workflows/apps-update.yml"
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit for an automated update candidate
        required: false
        type: string
  workflow_run:
    workflows: ["Update App Versions"]
    types: [completed]

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate app package flake
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Test changed-app detection
        run: bash packages/apps/tests/detect-changed-apps.sh
      - name: Test update isolation and patch preflight
        run: |
          bash packages/apps/tests/update-all.sh
          bash packages/apps/tests/update-review.sh
          bash packages/apps/tests/check-nix-patches.sh
          bash packages/apps/tests/notion-cli-update.sh
      - run: nix flake check ./packages/apps --no-build

  detect-app-changes:
    name: Detect changed app packages
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect package changes
        id: detect
        shell: bash
        env:
          DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base_sha="${{ github.event.before }}"
          elif [ -n "$DISPATCH_BASE_SHA" ]; then
            base_sha="$DISPATCH_BASE_SHA"
          elif git rev-parse "${{ github.sha }}~1" >/dev/null 2>&1; then
            base_sha="${{ github.sha }}~1"
          else
            base_sha=""
          fi

          apps=$(packages/apps/scripts/detect-changed-apps.sh "$base_sha" "${{ github.sha }}")
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  build-changed-apps:
    name: Build changed app packages
    needs:
      - evaluate
      - detect-app-changes
    if: needs.detect-app-changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-app-changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - name: Build package
        env:
          APP: ${{ matrix.app }}
        run: |
          packages=$(nix eval ./packages/apps#packages.x86_64-linux --apply builtins.attrNames --json)
          if jq -e --arg app "$APP" 'index($app) != null' <<<"$packages" >/dev/null; then
            nix build "./packages/apps#packages.x86_64-linux.$APP" --no-link
          else
            echo "Skipping $APP: not available for x86_64-linux"
          fi
