version: 1

meta:
  app: starship
  theme: one-half-light
  variant: light

slots:
  foam: "{palette.blue}"
  rose: "{palette.magenta}"
  # Git status tones mix canonical green/yellow/red with 65% ui.fg for layer3 contrast.
  pine: "#405e47"
  gold: "#68542b"
  love: "#744444"
  format: |-
    [](rose)\
    [ 󰉋 ](bg:rose fg:base)\
    [](fg:rose bg:foam)\
    $directory\
    [](fg:foam bg:layer3)\
    $git_branch\
    $git_status\
    [](fg:layer3 bg:layer2)\
    $c\
    $cpp\
    $rust\
    $golang\
    $nodejs\
    $php\
    $java\
    $kotlin\
    $haskell\
    $python\
    [](fg:layer2 bg:layer1)\
    $docker_context\
    $conda\
    $pixi\
    [](fg:layer1)\
    $fill\
    [](fg:layer1)\
    $kubernetes\
    [](fg:layer2 bg:layer1)\
    $hostname\
    [](fg:layer3 bg:layer2)\
    $time\
    [](fg:layer3)
    $character

modules:
  directory:
    style: "fg:base bg:foam"
  git_branch:
    style: "fg:foam bg:layer3"
    format: "[ $symbol $branch ]($style)"
  git_status:
    style: "fg:foam bg:layer3"
    format: "[($conflicted$staged$modified$untracked$renamed$deleted$stashed$ahead_behind )]($style)"
    conflicted: "[=](bold fg:love bg:layer3)[$count](fg:love bg:layer3) "
    staged: "[+](bold fg:pine bg:layer3)[$count](fg:pine bg:layer3) "
    modified: "[!](bold fg:gold bg:layer3)[$count](fg:gold bg:layer3) "
    untracked: "[?](bold fg:gold bg:layer3)[$count](fg:gold bg:layer3) "
    renamed: "[»](bold fg:foam bg:layer3)$count "
    deleted: "[-](bold fg:love bg:layer3)[$count](fg:love bg:layer3) "
    stashed: "[*](bold fg:foam bg:layer3)$count "
    ahead: "[↑](bold fg:foam bg:layer3)[$count](fg:foam bg:layer3)"
    behind: "[↓](bold fg:gold bg:layer3)[$count](fg:foam bg:layer3)"
    diverged: "[↑](bold fg:foam bg:layer3)[$ahead_count](fg:foam bg:layer3)[↓](bold fg:gold bg:layer3)[$behind_count](fg:foam bg:layer3)"
  c:
    style: "fg:foam bg:layer2"
    format: "[ $symbol($version) ]($style)"
  cpp:
    style: "fg:foam bg:layer2"
    format: "[ $symbol($version) ]($style)"
  nodejs:
    style: "fg:pine bg:layer2"
    format: "[ $symbol($version) ]($style)"
  rust:
    style: "fg:love bg:layer2"
    format: "[ $symbol($version) ]($style)"
  golang:
    style: "fg:foam bg:layer2"
    format: "[ $symbol($version) ]($style)"
  php:
    style: "fg:iris bg:layer2"
    format: "[ $symbol($version) ]($style)"
  java:
    style: "fg:love bg:layer2"
    format: "[ $symbol($version) ]($style)"
  kotlin:
    style: "fg:iris bg:layer2"
    format: "[ $symbol($version) ]($style)"
  haskell:
    style: "fg:iris bg:layer2"
    format: "[ $symbol($version) ]($style)"
  python:
    style: "fg:gold bg:layer2"
    format: "[ $symbol($version) ]($style)"
  docker_context:
    style: "fg:foam bg:layer1"
    format: "[ $symbol($context) ]($style)"
  conda:
    style: "fg:pine bg:layer1"
    format: "[ $symbol($environment) ]($style)"
  pixi:
    style: "fg:pine bg:layer1"
    format: "[ $symbol($version) ($environment) ]($style)"
  kubernetes:
    style: "fg:foam bg:layer1"
    format: "[ $symbol$context ]($style)"
  time:
    style: "fg:foam bg:layer3"
    format: "[ 󰥔 $time ]($style)"
  hostname:
    style: "fg:love bg:layer2"
    format: "[ $hostname ]($style)"
  character:
    success_symbol: "[❯](bold fg:foam)"
